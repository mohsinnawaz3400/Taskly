
name: taskly_app
description: "A modern Flutter To-Do application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.5+1

  # Local database
  sqflite: ^2.4.2
  path: ^1.9.1

  # Preferences
  shared_preferences: ^2.5.3

  # Date formatting and task IDs
  intl: ^0.20.2
  uuid: ^4.5.1

  # Notifications and timezone
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# App launcher icon configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#3516C9"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  # App assets
  assets:
    - assets/icon/
    - assets/icons/
